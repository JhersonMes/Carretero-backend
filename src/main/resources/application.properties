spring.application.name=CarreteroBackend
server.port=8080

# JPA / Hibernate settings
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# ----------------------------------------------------
# OPCION A: Conexion a MySQL (Entorno Local en el Restaurante)
# ----------------------------------------------------
spring.jpa.database=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/carreterodb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ----------------------------------------------------
# Optimizacion de HikariCP para Hardware de Baja Gama (Laptop)
# ----------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ----------------------------------------------------
# OPCION B: Conexion a H2 en memoria (Para pruebas/desarrollo sin MySQL)
# ----------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:carreterodb;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Seguridad JWT (En produccion, definir la variable de entorno JWT_SECRET)
jwt.secret=${JWT_SECRET}
