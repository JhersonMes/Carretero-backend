spring.application.name=CarreteroBackend
server.port=${PORT:8080}

# JPA / Hibernate settings
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# ----------------------------------------------------
# OPCION A: Conexion a MySQL (Entorno Local en el Restaurante)
# ----------------------------------------------------
spring.jpa.database=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carreterodb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ----------------------------------------------------
# Optimizacion de HikariCP para Hardware de Baja Gama (Laptop)
# ----------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ----------------------------------------------------
# OPCION B: Conexion a H2 en memoria (Para pruebas/desarrollo sin MySQL)
# ----------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:carreterodb;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Seguridad JWT (En produccion, definir la variable de entorno JWT_SECRET)
jwt.secret=${JWT_SECRET}

# ----------------------------------------------------
# Emision electronica de comprobantes (SUNAT)
# ----------------------------------------------------
# El AMBIENTE (SIMULADO / BETA / PRODUCCION) se elige en la tabla business_config,
# porque es una decision del negocio. Aqui van solo las credenciales, que son
# secretos y no deben vivir en la base de datos ni viajar en un DTO.
#
# Para el ambiente BETA de SUNAT, que es gratuito y no requiere PSE:
#   SUNAT_SOL_USER=20610046097MODDATOS
#   SUNAT_SOL_PASSWORD=MODDATOS
#   SUNAT_CERT_PATH=certificados/prueba.pfx   (autofirmado; en beta no se valida)
carretero.sunat.sol-user=${SUNAT_SOL_USER:}
carretero.sunat.sol-password=${SUNAT_SOL_PASSWORD:}
carretero.sunat.certificate-path=${SUNAT_CERT_PATH:}
carretero.sunat.certificate-password=${SUNAT_CERT_PASSWORD:}
carretero.sunat.storage-dir=${SUNAT_STORAGE_DIR:./comprobantes}
carretero.sunat.timeout-seconds=30

# ----------------------------------------------------
# Correo (recuperacion de contrasena, RF-06)
# ----------------------------------------------------
# ARCHIVO: guarda el correo como .eml en la carpeta indicada (desarrollo y pruebas).
# SMTP: lo envia de verdad. Ej. Gmail: host smtp.gmail.com, puerto 465, ssl true y una
#       "contrasena de aplicacion" en MAIL_PASSWORD.
carretero.mail.mode=${MAIL_MODE:ARCHIVO}
carretero.mail.outbox-dir=${MAIL_OUTBOX_DIR:./correo-saliente}
carretero.mail.from=${MAIL_FROM:no-responder@elcarretero.pe}
carretero.mail.host=${MAIL_HOST:}
carretero.mail.port=${MAIL_PORT:465}
carretero.mail.ssl=${MAIL_SSL:true}
carretero.mail.username=${MAIL_USERNAME:}
carretero.mail.password=${MAIL_PASSWORD:}
# Direccion de la aplicacion web, para armar el enlace del correo
carretero.app.frontend-url=${FRONTEND_URL:http://localhost:4200}
